# Keeps the site in sync with the Google Sheet that holds all the text and picture links.
# Every 10 minutes it downloads the Sheet, rebuilds the English, Swedish and Finnish
# pages, and commits them if anything changed. It also runs when code is pushed.
name: Rebuild pages

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths:
      - "build/**"
      - "assets/style.css"
      - "assets/main.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download text from Google Sheet
        run: |
          id=$(tr -d '[:space:]' < build/sheet_id.txt)
          code=$(curl -sSL --retry 3 -w "%{http_code}" "https://docs.google.com/spreadsheets/d/${id}/export?format=csv" -o /tmp/sheet.csv)
          echo "Google answered HTTP $code"
          # A private sheet returns a sign-in page instead of CSV
          if [ "$code" != "200" ] || ! head -1 /tmp/sheet.csv | sed 's/^\xEF\xBB\xBF//' | grep -q "What it is"; then
            echo "::error::Could not read the Google Sheet (HTTP $code). Check that it is shared as 'Anyone with the link can view'. First line: $(head -c 120 /tmp/sheet.csv | tr -d '\n')"
            exit 1
          fi
          tr -d '\r' < /tmp/sheet.csv > build/content.csv
      - name: Swap in new pictures from the Sheet
        run: |
          pip install --quiet pillow
          python3 build/images.py
      - name: Build pages
        run: python3 build/build.py
      - name: Commit updated pages
        run: |
          git add build/content.csv build/images.json assets/img index.html sv/index.html fi/index.html
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update text and pictures from Google Sheet"
          git push
